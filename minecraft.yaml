  ControlUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt ControlFunction.Arn
      AuthType: NONE

  ControlUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ControlFunction
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  ControlInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ControlFunction
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

Outputs:
  ServerAddress:
    Description: Adresse a saisir dans Minecraft (Multijoueur > Ajouter un serveur)
    Value: !Ref ElasticIp
  ControlPageUrl:
    Description: Page web de demarrage/arret du serveur
    Value: !GetAtt ControlUrl.FunctionUrl
  InstanceId:
    Value: !Ref Instance
  SetupAssociationId:
    Description: Association SSM qui installe/met a jour le serveur
    Value: !GetAtt SetupAssociation.AssociationId
  DataVolumeId:
    Description: Volume EBS contenant les mondes
    Value: !Ref DataVolume
