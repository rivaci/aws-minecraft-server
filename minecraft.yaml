          <button id=stop disabled>Arrêter</button><p id=msg></p><script>
          const T={pending:"🟠 Démarrage…",running:"🟢 Allumé",stopping:"🟠 Arrêt…",stopped:"⚪ Éteint"},$=id=>document.getElementById(id);let cur={};
          function show(s){cur=s;$("st").textContent=T[s.state]||s.state;$("ip").textContent=s.ip;
          $("pl").textContent=s.state!="running"?"":s.players?s.players.online+" / "+s.players.max+" joueurs connectés":"Minecraft démarre…";
          $("start").disabled=s.state!="stopped";$("stop").disabled=s.state!="running"}
